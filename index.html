<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encomienda Jireh — Versión beta</title>
<link rel="icon" href="logo-jireh.svg" type="image/svg+xml">
<style>
:root{--bg:#f5f5f0;--card:#fff;--ink:#252823;--muted:#77796f;--line:#e5e5dc;--green:#0f6e56;--pale:#e1f5ee;--side:#193b32;--side2:#225346;--red:#b54739;--amber:#a76d13;--shadow:0 2px 10px #172d2410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",Arial,sans-serif}.app{min-height:100vh;display:flex}.sidebar{width:238px;background:var(--side);color:#eef5f1;display:flex;flex-direction:column;flex-shrink:0}.brand{padding:23px 20px;background:var(--side2);font-size:17px;font-weight:700}.brand small{display:block;font-size:11px;font-weight:400;color:#c6ddd3;margin-top:4px}.nav{padding:12px 9px;flex:1}.nav button,.side-action{width:100%;text-align:left;border:0;border-radius:7px;color:#dbe9e2;background:transparent;padding:11px 13px;margin:2px 0;cursor:pointer;font:inherit}.nav button:hover,.nav button.active{background:#2c604f;color:white}.side-foot{padding:12px;border-top:1px solid #ffffff20}.side-foot button{padding:8px 12px;font-size:12px}.user{background:#ffffff12;padding:9px 11px;border-radius:7px;margin:6px 0;font-size:12px}.main{flex:1;min-width:0}.top{height:64px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.top h1{font-size:19px;margin:0}.date{color:var(--muted);font-size:12px}.content{padding:24px 28px;max-width:1450px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.intro h2{font-size:21px;margin:0 0 4px}.intro p{margin:0;color:var(--muted)}.btn{border:0;border-radius:7px;background:var(--green);color:white;padding:10px 15px;font-weight:600;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.secondary{background:var(--pale);color:var(--green)}.btn.light{background:#f0f0ea;color:#34372f}.btn.danger{background:#fff0ed;color:var(--red)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}.stat{padding:17px 18px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:8px}.stat span{color:var(--muted);font-size:11px}.section-title{font-size:13px;font-weight:700;color:var(--green);background:#f1efe8;padding:10px 14px}.body{padding:15px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.field input,.field select,.field textarea,.search{width:100%;padding:10px 11px;border:1px solid #d9dbd2;border-radius:6px;background:#fff;font:inherit;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--green);box-shadow:0 0 0 3px #0f6e5618}.field textarea{min-height:68px;resize:vertical}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:12px}th{background:#fafaf7;color:var(--muted);font-weight:600}tbody tr:hover{background:#fbfcf9}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#fff4dc;color:var(--amber);font-size:11px}.badge.paid{background:#e4f6ed;color:var(--green)}.badge.cancel{background:#fff0ed;color:var(--red)}.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0}.search{max-width:360px}.item-row{display:grid;grid-template-columns:2fr .7fr .8fr .9fr 38px;gap:8px;margin-bottom:8px}.item-row input{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}.total-box{margin-left:auto;width:290px;padding:15px;background:#f7faf7;border:1px solid var(--line);border-radius:8px}.total-line{display:flex;justify-content:space-between;margin:5px 0;color:var(--muted)}.total-line.grand{border-top:1px solid var(--line);padding-top:9px;color:var(--ink);font-size:17px;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;color:var(--muted);padding:28px}.notice{padding:13px 15px;background:#eef7f2;border-radius:8px;color:#315d4b;margin-bottom:14px;font-size:13px}.chart{height:180px;display:flex;align-items:end;gap:10px;padding:15px}.barcol{flex:1;text-align:center;color:var(--muted);font-size:10px}.bar{background:#82c9a9;border-radius:5px 5px 0 0;min-height:6px;margin:8px auto 5px;width:70%;max-width:40px}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#14251f88;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fff;border-radius:11px;padding:20px;width:min(460px,100%);box-shadow:0 15px 50px #0003}.modal h3{margin-top:0}.right{text-align:right}
#mobileMenu{display:none}@media(max-width:900px){.sidebar{width:205px}.content{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}}
/* Ajustes para móviles */
@media(max-width:650px){
  body{font-size:14px}.app{display:block;min-height:100dvh}
  .sidebar{width:100%;position:sticky;top:0;z-index:4;box-shadow:0 2px 8px #172d2418}
  .brand{padding:10px 14px;font-size:15px}.brand small{display:inline;margin:0 0 0 7px;font-size:10px}
  .nav{display:flex;overflow-x:auto;overflow-y:hidden;padding:6px 8px;gap:5px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;width:auto;white-space:nowrap;margin:0;padding:8px 11px;font-size:12px}
  .side-foot{display:none}.main{width:100%}.top{height:48px;padding:0 14px}.top h1{font-size:16px}.date{font-size:10px}
  .content{padding:14px 12px 24px}.intro{align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:15px}.intro h2{font-size:19px}.intro p{font-size:12px}
  .two,.three{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}
  .stat{padding:12px}.stat strong{font-size:19px;margin-top:5px}.stat label{font-size:11px}.stat span{font-size:10px}
  .card{border-radius:8px}.section-title{padding:9px 11px;font-size:12px}.body{padding:12px}
  .grid.two .field{margin-bottom:10px}.field input,.field select,.field textarea{font-size:16px;padding:11px}/* Evita zoom automático en iPhone */
  .item-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;padding:9px 0;border-bottom:1px solid var(--line)}
  .item-row input{min-width:0;font-size:15px;padding:10px}.item-row input:first-child{grid-column:1/-1}.item-row button{grid-column:2;justify-self:end}
  .total-box{width:100%;margin:12px 0 0}.actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(8px + env(safe-area-inset-bottom));z-index:2}.actions .btn{flex:1;padding:12px 8px}
  .toolbar{display:block}.search{max-width:none;font-size:16px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:720px}th,td{padding:10px;font-size:11px}
  .chart{height:160px;gap:4px;padding:12px 5px}.barcol{font-size:9px}.bar{width:65%}
  .modal-back{align-items:end;padding:0}.modal{width:100%;max-height:88dvh;overflow:auto;border-radius:15px 15px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
}
@media(max-width:380px){.brand small{display:block;margin:2px 0 0 25px}.content{padding-left:9px;padding-right:9px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:17px}.nav button{padding:8px 9px}.date{max-width:120px;text-align:right}}
@media(max-width:650px){.sidebar{position:static;box-shadow:none}.brand{padding:9px 13px;font-size:14px}.brand small{display:inline;margin-left:6px}.sidebar .nav{display:none}.top{position:sticky;top:0;z-index:3;height:auto;min-height:54px;gap:8px;padding:8px 12px;background:#fff}.top h1{flex:1;min-width:0;font-size:15px}.top .date{display:none}#mobileMenu{display:block;max-width:155px;min-width:118px;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit;font-size:12px}.content{padding-top:12px}.intro .btn{min-height:40px}.field input,.field select,.field textarea{min-height:44px}.table-wrap{border-radius:7px}.actions{bottom:0;padding-left:5px;padding-right:5px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><img class="brand-mark" src="logo-jireh.svg" alt=""><span class="brand-copy">Encomienda Jireh<small>Versión beta</small></span></div><nav class="nav" id="nav"></nav><div class="side-foot"><button class="side-action" id="theme">🌙 Modo oscuro</button><button class="side-action" onclick="backup()">💾 Descargar respaldo</button><small style="display:block;padding:8px;color:#b8cec4">Encomienda Jireh · versión web</small></div></aside><main class="main"><header class="top"><h1 id="pageTitle">Dashboard</h1><select id="mobileMenu" aria-label="Ir a sección"><option value="" selected>☰ Secciones</option></select><span class="date" id="today"></span></header><div class="content" id="view"></div></main></div><div id="modalRoot"></div>
<script>
const pages=[['nueva','➕','Nueva encomienda'],['historial','📋','Historial'],['mensual','📅','Hist. mensual'],['clientes','👤','Hist. clientes'],['costos','💰','Costos viaje'],['cobrar','🧾','Ctas. cobrar'],['arqueo','💵','Arqueo caja'],['kpi','📊','Dashboard KPI'],['reportes','📈','Reportes'],['config','⚙️','Configuración']];function readStore(key){try{return localStorage.getItem(key)||'[]'}catch(e){return '[]'}}function parseStore(key){try{const value=JSON.parse(readStore(key));return Array.isArray(value)?value:[]}catch(e){console.warn('Datos locales inválidos en '+key,e);return []}}let shipments=parseStore('jireh_shipments'),costs=parseStore('jireh_costs'),active='nueva',dark=false;
const nav=document.querySelector('#nav'),view=document.querySelector('#view'),mobileMenu=document.querySelector('#mobileMenu');document.querySelector('#today').textContent=new Intl.DateTimeFormat('es-NI',{dateStyle:'full'}).format(new Date());nav.innerHTML=pages.map(([id,icon,name])=>`<button data-page="${id}">${icon} &nbsp;${name}</button>`).join('');mobileMenu.innerHTML+='<option disabled>──────────</option>'+pages.map(([id,icon,name])=>`<option value="${id}">${icon} ${name}</option>`).join('');nav.onclick=e=>{let b=e.target.closest('[data-page]');if(b)show(b.dataset.page)};mobileMenu.onchange=()=>{if(mobileMenu.value)show(mobileMenu.value)};function money(v){return '$'+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function localDate(){const now=new Date();return new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10)}function save(){try{localStorage.setItem('jireh_shipments',JSON.stringify(shipments));localStorage.setItem('jireh_costs',JSON.stringify(costs));return true}catch(error){console.error('No se pudieron guardar los datos en localStorage.',error);alert('No se pudieron guardar los cambios en este navegador. Descarga un respaldo y revisa el espacio disponible.');return false}}function show(p){active=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));mobileMenu.value=p;document.querySelector('#pageTitle').textContent=pages.find(x=>x[0]===p)?.[2]||p;({nueva:renderNew,historial:renderHistory,mensual:renderMonth,clientes:renderClients,costos:renderCosts,cobrar:renderDebts,arqueo:renderCash,kpi:renderKpi,reportes:renderReports,config:renderConfig}[p]||renderNew)()}
function renderNew(){view.innerHTML=`<div class="intro"><div><h2>Registrar envío</h2><p>Completa los datos del remitente, destinatario y artículos.</p></div></div><form id="shipment"><div class="grid two"><section class="card"><div class="section-title">👤 REMITENTE</div><div class="body grid two"><div class="field"><label>Nombre *</label><input name="sender" required placeholder="Nombre completo"></div><div class="field"><label>Teléfono</label><input name="senderPhone" placeholder="+1 (000) 000-0000"></div></div></section><section class="card"><div class="section-title">📦 DESTINATARIO</div><div class="body grid two"><div class="field"><label>Nombre *</label><input name="receiver" required placeholder="Nombre completo"></div><div class="field"><label>Teléfono</label><input name="receiverPhone" placeholder="+505 0000 0000"></div><div class="field"><label>Dirección USA</label><input name="address" placeholder="Dirección de entrega"></div><div class="field"><label>Ciudad destino</label><input name="destination" placeholder="Miami, FL"></div></div></section></div><section class="card" style="margin-top:15px"><div class="section-title">📋 DETALLE DE ARTÍCULOS <button class="btn secondary" type="button" onclick="addItem()" style="float:right;padding:4px 10px;margin-top:-4px">＋ Agregar artículo</button></div><div class="body"><div id="items"></div><div class="field" style="max-width:350px;margin-top:12px"><label>Valor de correo externo ($)</label><input name="postage" type="number" min="0" step=".01" value="0" oninput="calc()"></div><div class="total-box"><div class="total-line"><span>Peso total</span><b id="weight">0 lb</b></div><div class="total-line"><span>Valor declarado</span><b id="subtotal">$0.00</b></div><div class="total-line"><span>Correo externo</span><b id="postageTotal">$0.00</b></div><div class="total-line grand"><span>Total</span><b id="grand">$0.00</b></div></div></div></section><div class="grid two" style="margin-top:15px"><section class="card"><div class="section-title">📝 NOTAS</div><div class="body"><div class="field"><label>Observaciones del envío</label><textarea name="note" placeholder="Indicaciones especiales..."></textarea></div></div></section><section class="card"><div class="section-title">💳 ESTADO DE PAGO</div><div class="body grid two"><div class="field"><label>Estado</label><select name="status"><option>Pendiente</option><option>Abono</option><option>Pagado</option></select></div><div class="field"><label>Abono inicial ($)</label><input name="paid" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Tipo de pago</label><select name="payment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div></div></section></div><div class="actions"><button class="btn light" type="reset">Limpiar</button><button class="btn" type="submit">Guardar encomienda</button></div></form>`;addItem();document.querySelector('#shipment').onsubmit=submitShipment}
function addItem(){const row=document.createElement('div');row.className='item-row';row.innerHTML='<input placeholder="Descripción del artículo" required class="desc"><input type="number" min="1" value="1" placeholder="Cantidad" class="qty"><input type="number" min="0" step=".1" value="0" placeholder="Peso (lb)" class="lbs"><input type="number" min="0" step=".01" value="0" placeholder="Valor ($)" class="value"><button type="button" class="btn danger" aria-label="Quitar" onclick="this.parentElement.remove();calc()">×</button>';row.querySelectorAll('input').forEach(i=>i.oninput=calc);document.querySelector('#items').append(row);calc()}function calc(){let rows=[...document.querySelectorAll('.item-row')],weight=0,value=0;rows.forEach(r=>{weight+=Number(r.querySelector('.lbs').value||0)*Number(r.querySelector('.qty').value||1);value+=Number(r.querySelector('.value').value||0)*Number(r.querySelector('.qty').value||1)});let post=Number(document.querySelector('[name=postage]')?.value||0);document.querySelector('#weight').textContent=weight.toFixed(1)+' lb';document.querySelector('#subtotal').textContent=money(value);document.querySelector('#postageTotal').textContent=money(post);document.querySelector('#grand').textContent=money(value+post)}function submitShipment(e){e.preventDefault();const f=new FormData(e.target),items=[...document.querySelectorAll('.item-row')].map(r=>({description:r.querySelector('.desc').value,qty:+r.querySelector('.qty').value||1,lbs:+r.querySelector('.lbs').value||0,value:+r.querySelector('.value').value||0}));let subtotal=items.reduce((a,x)=>a+x.value*x.qty,0),total=subtotal+(+f.get('postage')||0),paid=+f.get('paid')||0;shipments.unshift({id:Date.now(),code:'ENV-'+String(shipments.length+1).padStart(4,'0'),date:localDate(),sender:f.get('sender'),senderPhone:f.get('senderPhone'),receiver:f.get('receiver'),receiverPhone:f.get('receiverPhone'),address:f.get('address'),destination:f.get('destination')||'Sin asignar',items,weight:items.reduce((a,x)=>a+x.lbs*x.qty,0),subtotal,total,paid,remaining:Math.max(0,total-paid),status:paid>=total?'Pagado':paid>0?'Abono':f.get('status'),payment:f.get('payment'),note:f.get('note')});save();alert('Encomienda guardada correctamente.');show('historial')}
function status(s){return `<span class="badge ${s==='Pagado'?'paid':s==='Cancelado'?'cancel':''}">${s}</span>`}function table(rows){if(!rows.length)return '<div class="empty">Todavía no hay registros.</div>';return `<div class="table-wrap"><table><thead><tr><th>CÓDIGO</th><th>FECHA</th><th>REMITENTE</th><th>DESTINATARIO</th><th>DESTINO</th><th>TOTAL</th><th>RESTANTE</th><th>ESTADO</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.code}</b></td><td>${x.date}</td><td>${esc(x.sender)}</td><td>${esc(x.receiver)}</td><td>${esc(x.destination)}</td><td>${money(x.total)}</td><td>${money(x.remaining)}</td><td>${status(x.status)}</td><td><button class="btn secondary" onclick="details(${x.id})">Ver</button> <button class="btn light" onclick="addPayment(${x.id})">Abonar</button></td></tr>`).join('')}</tbody></table></div>`}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderHistory(){view.innerHTML=`<div class="intro"><div><h2>Historial de encomiendas</h2><p>Busca envíos, revisa sus detalles y registra abonos.</p></div><button class="btn" onclick="show('nueva')">＋ Nueva encomienda</button></div><div class="toolbar"><input class="search" id="filter" placeholder="Buscar código, nombre o destino…"></div><section class="card" id="historyTable"></section>`;document.querySelector('#filter').oninput=filterHistory;filterHistory()}function filterHistory(){let q=document.querySelector('#filter').value.toLowerCase(),rows=shipments.filter(x=>[x.code,x.sender,x.receiver,x.destination].some(v=>String(v).toLowerCase().includes(q)));document.querySelector('#historyTable').innerHTML=table(rows)}
function details(id){let x=shipments.find(s=>s.id===id);if(!x)return;modal(`<h3>Encomienda ${x.code}</h3><p><b>Remitente:</b> ${esc(x.sender)} · ${esc(x.senderPhone)}</p><p><b>Destinatario:</b> ${esc(x.receiver)} · ${esc(x.receiverPhone)}</p><p><b>Destino:</b> ${esc(x.destination)} · ${esc(x.address)}</p><div class="table-wrap"><table><tr><th>Artículo</th><th>Cant.</th><th>Peso</th><th>Valor</th></tr>${x.items.map(i=>`<tr><td>${esc(i.description)}</td><td>${i.qty}</td><td>${i.lbs} lb</td><td>${money(i.value*i.qty)}</td></tr>`).join('')}</table></div><p><b>Total:</b> ${money(x.total)} &nbsp; <b>Abonado:</b> ${money(x.paid)} &nbsp; <b>Saldo:</b> ${money(x.remaining)}</p><p>${esc(x.note)}</p><div class="actions"><button class="btn light" onclick="closeModal()">Cerrar</button><button class="btn" onclick="window.print()">Imprimir</button></div>`)}function addPayment(id){let x=shipments.find(s=>s.id===id);if(!x)return;modal(`<h3>Registrar abono · ${x.code}</h3><p>Saldo pendiente: <b>${money(x.remaining)}</b></p><div class="field"><label>Monto del pago ($)</label><input id="payAmount" type="number" min=".01" max="${x.remaining}" step=".01" value="${x.remaining}"></div><div class="field"><label>Tipo de pago</label><select id="payType"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div><div class="actions"><button class="btn light" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePayment(${id})">Guardar abono</button></div>`)}function savePayment(id){let x=shipments.find(s=>s.id===id),amt=+document.querySelector('#payAmount').value;if(!amt||amt>x.remaining)return alert('Ingresa un monto válido.');x.paid+=amt;x.remaining=Math.max(0,x.total-x.paid);x.status=x.remaining===0?'Pagado':'Abono';save();closeModal();show(active)}function modal(s){document.querySelector('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${s}</div></div>`}function closeModal(){document.querySelector('#modalRoot').innerHTML=''}
function statsCard(label,val,sub=''){return `<div class="card stat"><label>${label}</label><strong>${val}</strong><span>${sub}</span></div>`}function renderKpi(){let today=localDate(),month=today.slice(0,7),todayRows=shipments.filter(x=>x.date===today),monthRows=shipments.filter(x=>x.date.startsWith(month));view.innerHTML=`<div class="intro"><div><h2>Resumen del negocio</h2><p>Indicadores calculados desde los envíos registrados en este navegador.</p></div></div><div class="grid stats">${statsCard('Envíos de hoy',todayRows.length,'Registrados hoy')}${statsCard('Envíos del mes',monthRows.length,'Este mes')}${statsCard('Cobrado este mes',money(monthRows.reduce((a,x)=>a+x.paid,0)),'Pagos registrados')}${statsCard('Cuentas pendientes',money(shipments.reduce((a,x)=>a+x.remaining,0)),'Saldo por cobrar')}</div><div class="grid two"><section class="card"><div class="section-title">Envíos recientes</div>${table(shipments.slice(0,6))}</section><section class="card"><div class="section-title">Estado de pagos</div><div class="body">${[['Pagado',shipments.filter(x=>x.status==='Pagado').length],['Con abono',shipments.filter(x=>x.status==='Abono').length],['Pendiente',shipments.filter(x=>x.status==='Pendiente').length]].map(([a,b])=>`<div class="total-line"><span>${a}</span><b>${b}</b></div>`).join('')}</div></section></div>`}function renderMonth(){let map={};shipments.forEach(x=>{let m=x.date.slice(0,7);map[m]=(map[m]||0)+1});let entries=Object.entries(map).sort().slice(-12),max=Math.max(1,...entries.map(x=>x[1]));view.innerHTML=`<div class="intro"><div><h2>Historial mensual</h2><p>Resumen de encomiendas registradas por mes.</p></div></div><section class="card"><div class="section-title">Envíos por mes</div><div class="chart">${entries.length?entries.map(([m,n])=>`<div class="barcol"><div class="bar" style="height:${130*n/max}px"></div>${m}<br>${n} envíos</div>`).join(''):'<div class="empty">Aún no hay datos mensuales.</div>'}</div></section>`}function renderClients(){let map={};shipments.forEach(x=>[x.sender,x.receiver].forEach(name=>{if(!name)return;map[name]??={name,count:0,total:0};map[name].count++;map[name].total+=x.total}));view.innerHTML=`<div class="intro"><div><h2>Historial de clientes</h2><p>Actividad agrupada por nombre de remitente y destinatario.</p></div></div><section class="card">${Object.values(map).length?`<div class="table-wrap"><table><thead><tr><th>CLIENTE</th><th>ENVÍOS RELACIONADOS</th><th>VALOR TOTAL</th></tr></thead><tbody>${Object.values(map).sort((a,b)=>b.count-a.count).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${money(x.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Aún no hay clientes registrados.</div>'}</section>`}
function renderDebts(){view.innerHTML=`<div class="intro"><div><h2>Cuentas por cobrar</h2><p>Encomiendas con saldo pendiente.</p></div></div><section class="card">${table(shipments.filter(x=>x.remaining>0))}</section>`}function renderCosts(){view.innerHTML=`<div class="intro"><div><h2>Costos de viaje</h2><p>Registra gastos relacionados con tus viajes.</p></div></div><section class="card"><div class="section-title">Nuevo costo</div><form class="body grid three" id="costForm"><div class="field"><label>Fecha</label><input type="date" name="date" value="${localDate()}" required></div><div class="field"><label>Categoría</label><select name="category"><option>Combustible</option><option>Peajes</option><option>Alimentación</option><option>Hospedaje</option><option>Otro</option></select></div><div class="field"><label>Monto ($)</label><input type="number" name="amount" min=".01" step=".01" required></div><div class="field"><label>Concepto</label><input name="concept" required></div><div class="field"><label>Nota</label><input name="note"></div><div class="field" style="align-self:end"><button class="btn">Guardar costo</button></div></form></section><section class="card" style="margin-top:15px"><div class="section-title">Gastos registrados</div>${costs.length?`<div class="table-wrap"><table><tr><th>FECHA</th><th>CATEGORÍA</th><th>CONCEPTO</th><th>MONTO</th></tr>${costs.map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${esc(x.concept)}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Aún no hay gastos.</div>'}</section>`;document.querySelector('#costForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);costs.unshift(Object.fromEntries(f));save();renderCosts()}}
function renderCash(){let paid=shipments.reduce((a,x)=>a+x.paid,0),spent=costs.reduce((a,x)=>a+Number(x.amount),0);view.innerHTML=`<div class="intro"><div><h2>Arqueo de caja</h2><p>Resumen rápido de ingresos y egresos registrados.</p></div></div><div class="grid stats">${statsCard('Ingresos registrados',money(paid))}${statsCard('Egresos registrados',money(spent))}${statsCard('Balance estimado',money(paid-spent))}${statsCard('Envíos',shipments.length)}</div><div class="notice">El arqueo refleja los datos guardados en este navegador.</div><section class="card"><div class="section-title">Movimientos recientes</div>${table(shipments.slice(0,8))}</section>`}function renderReports(){let paid=shipments.reduce((a,x)=>a+x.paid,0),cost=costs.reduce((a,x)=>a+Number(x.amount),0);view.innerHTML=`<div class="intro"><div><h2>Reportes</h2><p>Vista general de operación, cobros y costos.</p></div><button class="btn secondary" onclick="window.print()">Imprimir reporte</button></div><div class="grid stats">${statsCard('Encomiendas',shipments.length)}${statsCard('Valor total',money(shipments.reduce((a,x)=>a+x.total,0)))}${statsCard('Pagos recibidos',money(paid))}${statsCard('Costos de viaje',money(cost))}</div><section class="card"><div class="section-title">Detalle de envíos</div>${table(shipments)}</section>`}function renderConfig(){view.innerHTML=`<div class="intro"><div><h2>Configuración</h2><p>Información de esta versión local del sistema.</p></div></div><div class="notice">Esta interfaz HTML guarda los registros en el almacenamiento local del navegador. Los datos no se sincronizan automáticamente con la base SQLite de la aplicación de escritorio.</div><section class="card"><div class="section-title">Datos del sistema</div><div class="body"><p><b>Empresa:</b> Encomienda Jireh</p><p><b>Moneda:</b> Dólares estadounidenses ($)</p><p><b>Tarifa de referencia:</b> Configurable en la app de escritorio</p><p><b>Almacenamiento:</b> Este navegador</p><button class="btn danger" onclick="if(confirm('¿Eliminar todos los envíos y costos guardados en este navegador?')){shipments=[];costs=[];save();show('nueva')}">Borrar datos locales</button></div></section>`}function backup(){let data={shipments,costs,exportedAt:new Date().toISOString()},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='encomienda-jireh-respaldo.json';a.click();URL.revokeObjectURL(a.href)}document.querySelector('#theme').onclick=()=>{dark=!dark;document.documentElement.style.setProperty('--bg',dark?'#202722':'#f5f5f0');document.documentElement.style.setProperty('--card',dark?'#2c352f':'#fff');document.documentElement.style.setProperty('--ink',dark?'#edf4ef':'#252823');document.documentElement.style.setProperty('--line',dark?'#46534a':'#e5e5dc');document.documentElement.style.setProperty('--muted',dark?'#b3c0b7':'#77796f')};show('nueva');
</script>
<style>
.article-actions{display:flex;flex-wrap:wrap;gap:7px;padding:12px}.article-actions .btn{font-size:12px;padding:9px 11px}.article-group{border-top:1px solid var(--line)}.article-group h4{font-size:12px;margin:0;padding:8px 12px;background:#f8faf8;color:var(--green)}.article-line{display:grid;grid-template-columns:28px minmax(0,1fr) 70px 85px 90px 38px;gap:7px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}.article-line input,.article-modal input,.article-modal select{min-width:0;width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit}.article-line .line-no{color:var(--muted);text-align:center}.article-line .line-total{text-align:right;font-weight:700;color:var(--green);font-size:12px}.article-totalbar{display:flex;justify-content:space-between;align-items:center;background:var(--green);color:white;padding:12px 15px;font-weight:700}.article-totalbar small{color:#bce8d9;font-weight:500}.article-modal .field{margin:10px 0}.preset-list{display:grid;gap:8px}.preset-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 90px;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}.preset-row input{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px}.price-hint{font-size:11px;color:var(--muted)}
@media(max-width:650px){.article-line{grid-template-columns:24px minmax(0,1fr) 62px 78px 34px;gap:5px;padding:8px 6px}.article-line .line-total{grid-column:2/5;text-align:right;padding:0 4px 2px}.article-line input{font-size:14px;padding:9px 7px}.article-actions{display:grid;grid-template-columns:1fr 1fr;padding:10px}.article-actions .btn{min-height:42px;padding:8px 6px;font-size:11px}.preset-row{grid-template-columns:minmax(0,1fr) 60px 75px;gap:5px}.article-modal .modal{padding:16px 12px}}
</style>
<script>
const ARTICLE_PRICE_PER_LB=10;
const MEDICINES=[['Blister de pastilla',5],['Jarabe',5],['Inyección / Ampolla',12],['Pomada',3],['Gotero (ojos / oídos)',3]];
const DOCUMENTS=[['Carta',0],['Sobre',0],['Pasaporte',70],['Visa',0],['Documentos legales',0],['Fotografías',0],['Cheque',0],['Tarjeta',0],['Contrato',0],['Acta de nacimiento',30],['Diploma / Título',0],['Cédula',30],['Licencia',30],['Otro',0]];
function renderNew(){view.innerHTML=`<div class="intro"><div><h2>Registrar envío</h2><p>Completa los datos del remitente, destinatario y artículos.</p></div></div><form id="shipment"><div class="grid two"><section class="card"><div class="section-title">👤 REMITENTE</div><div class="body grid two"><div class="field"><label>Nombre *</label><input name="sender" required placeholder="Nombre completo"></div><div class="field"><label>Teléfono</label><input name="senderPhone" placeholder="Teléfono"></div></div></section><section class="card"><div class="section-title">📦 DESTINATARIO</div><div class="body grid two"><div class="field"><label>Nombre *</label><input name="receiver" required placeholder="Nombre completo"></div><div class="field"><label>Teléfono</label><input name="receiverPhone" placeholder="Teléfono"></div><div class="field"><label>Dirección USA</label><input name="address" placeholder="Dirección de entrega"></div><div class="field"><label>Ciudad destino</label><input name="destination" placeholder="Miami, FL"></div></div></section></div><section class="card" style="margin-top:15px"><div class="section-title">📋 DETALLE DE ARTÍCULOS <span id="articleCount" class="badge paid" style="float:right">0 artículos</span></div><div class="body" style="padding:8px 0"><div class="article-group"><h4>Producto regular · se cobra por libra ($${ARTICLE_PRICE_PER_LB}/lb)</h4><div id="productRows"></div></div><div class="article-actions"><button type="button" class="btn" style="background:#633806" onclick="openWeightItem()">⚖️ Por peso</button><button type="button" class="btn" style="background:#6b2fa0" onclick="openPresetItems('medicamento')">💊 Medicamentos</button><button type="button" class="btn" style="background:#9e2a2a" onclick="openPresetItems('documento')">📄 Documentos</button><button type="button" class="btn" style="background:#2a5a8a" onclick="openOtherItem()">📦 Artículos varios</button></div><div id="specialGroups"></div><div style="padding:10px 14px"><div class="field" style="max-width:320px"><label>Correo externo · lugar</label><input name="postagePlace" placeholder="Nombre del correo o lugar"><label style="margin-top:8px">Valor correo externo ($)</label><input name="postage" type="number" min="0" step=".01" value="0" oninput="calc()"></div></div><div class="article-totalbar"><small id="articleCountSummary">0 artículos</small><span>TOTAL → &nbsp;<b id="grand">$0.00</b></span></div></div></section><div class="grid two" style="margin-top:15px"><section class="card"><div class="section-title">📝 NOTAS</div><div class="body"><div class="field"><label>Observaciones del envío</label><textarea name="note" placeholder="Indicaciones especiales..."></textarea></div></div></section><section class="card"><div class="section-title">💳 ESTADO DE PAGO</div><div class="body grid two"><div class="field"><label>Estado</label><select name="status"><option>Pendiente</option><option>Abono</option><option>Pagado</option></select></div><div class="field"><label>Abono inicial ($)</label><input name="paid" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Tipo de pago</label><select name="payment"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div></div></section></div><div class="actions"><button class="btn light" type="reset">Limpiar</button><button class="btn" type="submit">Guardar encomienda</button></div></form>`;document.querySelector('#shipment').onsubmit=submitShipment}
function addProductRow(data={}){const row=document.createElement('div');row.className='article-line product-row';row.innerHTML=`<span class="line-no"></span><input class="desc" placeholder="Descripción" value="${esc(data.description||'')}"><input class="qty" type="number" min="1" value="${data.qty||1}" aria-label="Cantidad"><input class="lbs" type="number" min="0" step=".01" value="${data.lbs||''}" placeholder="Peso lb" aria-label="Peso en libras"><span class="line-total">$0.00</span><button type="button" class="btn danger" onclick="this.closest('.article-line').remove();calc()" aria-label="Eliminar">×</button>`;row.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));document.querySelector('#productRows').append(row);calc()}
function currentArticleItems(){const items=[];document.querySelectorAll('.product-row').forEach(r=>{const description=r.querySelector('.desc').value.trim(),qty=+r.querySelector('.qty').value||1,lbs=+r.querySelector('.lbs').value||0;if(description)items.push({description,qty,lbs,value:0,type:'producto',amount:qty*lbs*ARTICLE_PRICE_PER_LB})});return items}
function calc(){const items=currentArticleItems(),external=+(document.querySelector('[name=postage]')?.value||0);let index=0;document.querySelectorAll('.product-row').forEach(r=>{r.querySelector('.line-no').textContent=++index;r.querySelector('.line-total').textContent=money((+r.querySelector('.qty').value||1)*(+r.querySelector('.lbs').value||0)*ARTICLE_PRICE_PER_LB)});document.querySelectorAll('#specialGroups .special-row').forEach(r=>{r.querySelector('.line-no').textContent=++index});const all=items.concat(JSON.parse(document.querySelector('#specialGroups')?.dataset.items||'[]'));const total=all.reduce((sum,i)=>sum+(+i.amount||0),0)+external,count=all.length;document.querySelector('#grand').textContent=money(total);document.querySelector('#articleCount').textContent=`${count} artículos`;document.querySelector('#articleCountSummary').textContent=`${count} artículos`}
function setSpecialItems(items){const root=document.querySelector('#specialGroups');root.dataset.items=JSON.stringify(items);const groups=[['peso','⚖️ ENVÍOS POR PESO','#633806'],['medicamento','💊 MEDICAMENTOS','#6b2fa0'],['documento','📄 DOCUMENTOS','#9e2a2a'],['varios','📦 ARTÍCULOS VARIOS','#2a5a8a']];root.innerHTML=groups.map(([type,title,color])=>{const rows=items.filter(x=>x.type===type);return rows.length?`<div class="article-group"><h4 style="color:${color}">${title}</h4>${rows.map((x,i)=>`<div class="article-line special-row type-${type}"><span class="line-no">${i+1}</span><span>${esc(x.description)}</span><span>${x.qty>1?'×'+x.qty:''}</span><span>${type==='peso'?x.lbs+' lb':money(x.value)+' c/u'}</span><span class="line-total">${money(x.amount)}</span><button type="button" class="btn danger" onclick="removeSpecialItem('${type}',${i})">×</button></div>`).join('')}</div>`:''}).join('');calc()}
function removeSpecialItem(type,index){const items=JSON.parse(document.querySelector('#specialGroups').dataset.items||'[]'),matches=items.filter(x=>x.type===type);const target=matches[index];setSpecialItems(items.filter(x=>x!==target))}
function appendSpecialItems(newItems){const root=document.querySelector('#specialGroups'),items=JSON.parse(root.dataset.items||'[]');setSpecialItems(items.concat(newItems))}
function openWeightItem(){modal(`<div class="article-modal"><h3>⚖️ Envío por peso total</h3><p class="price-hint">Tarifa: $${ARTICLE_PRICE_PER_LB} por libra. Añade el paquete y su peso.</p><div class="field"><label>Descripción del envío</label><textarea id="weightDesc" placeholder="Ej. Caja de ropa"></textarea></div><div class="field"><label>Peso total (lb)</label><input id="weightLbs" type="number" min=".01" step=".01" placeholder="0.00"></div><div id="weightEstimate" class="notice">Costo estimado: $0.00</div><div class="article-actions"><button class="btn light" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmWeightItem()">✓ Agregar al envío</button></div></div>`);document.querySelector('#weightLbs').oninput=e=>document.querySelector('#weightEstimate').textContent='Costo estimado: '+money((+e.target.value||0)*ARTICLE_PRICE_PER_LB)}
function confirmWeightItem(){const lbs=+document.querySelector('#weightLbs').value;if(lbs<=0)return alert('Ingresa un peso válido en libras.');const description=document.querySelector('#weightDesc').value.trim()||'Envío por peso';appendSpecialItems([{description,qty:1,lbs,value:0,type:'peso',amount:lbs*ARTICLE_PRICE_PER_LB}]);closeModal()}
function openPresetItems(kind){const list=kind==='medicamento'?MEDICINES:DOCUMENTS,title=kind==='medicamento'?'💊 Medicamentos':'📄 Documentos',type=kind;modal(`<div class="article-modal preset-modal"><h3>${title}</h3><p class="price-hint">${kind==='medicamento'?'El precio de cada medicamento es fijo. Ajusta la cantidad que vas a agregar.':'Elige los documentos y define su cantidad. Los precios sugeridos se pueden editar.'}</p><div class="preset-list">${list.map(([name,price])=>{const fixed=+price>0,priceField=fixed?`<span class="preset-fixed-price">${money(price)} <small>precio fijo</small></span><input class="preset-price" type="hidden" value="${price}">`:`<label class="preset-price-edit">Precio ($)<input class="preset-price" type="number" min="0" step=".01" value="${price}" aria-label="Precio unitario de ${esc(name)}"></label>`;return `<div class="preset-row"><div class="preset-item-details"><strong>${esc(name)}</strong>${priceField}</div><div class="preset-qty-cell"><span class="preset-qty-label">Cantidad</span><div class="preset-qty-stepper"><button type="button" aria-label="Reducir cantidad de ${esc(name)}" onclick="changePresetQty(this,-1)">−</button><input class="preset-qty" type="number" min="0" step="1" inputmode="numeric" value="0" aria-label="Cantidad de ${esc(name)}" onchange="this.value=Math.max(0,Math.floor(+this.value||0))"><button type="button" aria-label="Aumentar cantidad de ${esc(name)}" onclick="changePresetQty(this,1)">+</button></div></div></div>`}).join('')}</div><div class="article-actions"><button class="btn light" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmPresetItems('${type}')">✓ Agregar seleccionados</button></div></div>`)}
function changePresetQty(button,delta){const input=button.closest('.preset-qty-stepper').querySelector('.preset-qty');input.value=Math.max(0,(parseInt(input.value,10)||0)+delta);input.dispatchEvent(new Event('change',{bubbles:true}))}
function confirmPresetItems(type){const items=[];document.querySelectorAll('.preset-row').forEach(r=>{const qty=Math.max(0,Math.floor(+r.querySelector('.preset-qty').value||0));if(qty>0){const description=r.querySelector('.preset-item-details strong')?.textContent.trim();const value=Math.max(0,+r.querySelector('.preset-price')?.value||0);if(description)items.push({description,qty,lbs:0,value,type,amount:qty*value})}});if(!items.length)return alert('Indica al menos una cantidad.');appendSpecialItems(items);closeModal()}
function openOtherItem(){modal(`<div class="article-modal other-item-modal"><h3>📦 Agregar artículo</h3><p class="price-hint">Registra artículos que no sean medicamentos ni documentos.</p><div class="field"><label for="otherKind">Categoría</label><select id="otherKind"><option>Ropa</option><option>Calzado</option><option>Electrónico</option><option>Juguete</option><option>Alimento no perecedero</option><option>Accesorio</option><option>Otro</option></select></div><div class="field"><label for="otherDesc">Descripción del artículo *</label><input id="otherDesc" required maxlength="100" placeholder="Ej. Camisa azul talla M"></div><div class="grid two"><div class="field"><label for="otherQty">Cantidad *</label><input id="otherQty" type="number" min="1" step="1" value="1" required oninput="updateOtherTotal()"></div><div class="field"><label for="otherPrice">Precio unitario ($) *</label><input id="otherPrice" type="number" min="0" step=".01" value="0" required oninput="updateOtherTotal()"></div></div><div class="other-item-total"><span>Total del artículo</span><strong id="otherTotal">$0.00</strong><small id="otherTotalHint">1 unidad × $0.00</small></div><div class="article-actions"><button class="btn light" type="button" onclick="closeModal()">Cancelar</button><button class="btn" type="button" onclick="confirmOtherItem()">＋ Agregar al envío</button></div></div>`);updateOtherTotal();document.querySelector('#otherDesc').focus()}
function updateOtherTotal(){const qty=Math.max(1,Math.floor(+document.querySelector('#otherQty')?.value||1)),price=Math.max(0,+document.querySelector('#otherPrice')?.value||0),total=qty*price;document.querySelector('#otherTotal').textContent=money(total);document.querySelector('#otherTotalHint').textContent=`${qty} ${qty===1?'unidad':'unidades'} × ${money(price)}`}

<script>
function setSpecialItems(items){const root=document.querySelector('#specialGroups');root.dataset.items=JSON.stringify(items);const groups=[['peso','⚖️ ENVÍOS POR PESO','#633806'],['medicamento','💊 MEDICAMENTOS','#6b2fa0'],['documento','📄 DOCUMENTOS','#9e2a2a'],['varios','📦 ARTÍCULOS VARIOS','#2a5a8a']];root.innerHTML=groups.map(([type,title,color])=>{const rows=items.filter(x=>x.type===type);return rows.length?`<div class="article-group"><h4 style="color:${color}">${title}</h4>${rows.map((x,i)=>`<div class="article-line special-row"><span class="line-no">${i+1}</span><span>${esc(x.description)}</span><span>${x.qty>1?'×'+x.qty:''}</span><span>${type==='peso'?x.lbs+' lb':money(x.value)+' c/u'}</span><span class="line-total">${money(x.amount)}</span><span class="article-row-actions"><button type="button" class="btn secondary" title="Editar artículo" aria-label="Editar ${esc(x.description)}" onclick="editSpecialItem('${type}',${i})">✎</button><button type="button" class="btn danger" title="Eliminar artículo" aria-label="Eliminar ${esc(x.description)}" onclick="removeSpecialItem('${type}',${i})">×</button></span></div>`).join('')}</div>`:''}).join('');calc()}
function editSpecialItem(type,index){const items=JSON.parse(document.querySelector('#specialGroups').dataset.items||'[]'),item=items.filter(x=>x.type===type)[index];if(!item)return;const weight=type==='peso';modal(`<div class="article-modal"><h3>✎ Editar artículo</h3><div class="field"><label>Descripción</label><input id="specialEditDesc" value="${esc(item.description)}"></div>${weight?`<div class="field"><label>Peso total (lb)</label><input id="specialEditLbs" type="number" min=".01" step=".01" value="${+item.lbs||0}"></div><div class="notice">Tarifa: $${ARTICLE_PRICE_PER_LB} por libra</div>`:`<div class="grid two"><div class="field"><label>Cantidad</label><input id="specialEditQty" type="number" min="1" step="1" value="${+item.qty||1}"></div><div class="field"><label>Precio unitario ($)</label><input id="specialEditPrice" type="number" min="0" step=".01" value="${+item.value||0}"></div></div>`}<div class="article-actions"><button class="btn light" type="button" onclick="closeModal()">Cancelar</button><button class="btn" type="button" onclick="saveSpecialEdit('${type}',${index})">Guardar cambios</button></div></div>`)}
function saveSpecialEdit(type,index){const items=JSON.parse(document.querySelector('#specialGroups').dataset.items||'[]'),matches=items.filter(x=>x.type===type),item=matches[index];if(!item)return;item.description=document.querySelector('#specialEditDesc').value.trim()||item.description;if(type==='peso'){item.lbs=+document.querySelector('#specialEditLbs').value||0;if(item.lbs<=0)return alert('Ingresa un peso válido.');item.qty=1;item.value=0;item.amount=item.lbs*ARTICLE_PRICE_PER_LB}else{item.qty=+document.querySelector('#specialEditQty').value||1;item.value=+document.querySelector('#specialEditPrice').value||0;item.amount=item.qty*item.value}setSpecialItems(items);closeModal()}
show(active);

<script>
// Etiqueta celdas con su encabezado y convierte las tablas dinámicas en tarjetas móviles.
(function(){
  const root=document.querySelector('#view');
  if(!root)return;
  function prepareTables(){
    root.querySelectorAll('.table-wrap table').forEach(table=>{
      table.classList.add('mobile-card-table');
      const rows=[...table.rows],header=rows.find(row=>[...row.cells].some(cell=>cell.tagName==='TH'));
      if(!header)return;
      const labels=[...header.cells].map((cell,index)=>cell.textContent.trim()|| (index===header.cells.length-1?'Acciones':''));
      if(!table.tHead)header.classList.add('mobile-table-header');
      rows.filter(row=>row!==header).forEach(row=>[...row.cells].forEach((cell,index)=>{
        cell.dataset.label=labels[index]||'Detalle';
        if(index===row.cells.length-1&&cell.querySelector('button'))cell.classList.add('mobile-table-actions');
      }));
    });
  }
  prepareTables();
  new MutationObserver(prepareTables).observe(root,{childList:true,subtree:true});
})();
</script>
